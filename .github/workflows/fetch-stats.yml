name: Fetch Rocket League Stats

on:
  workflow_dispatch: # Manual trigger only

permissions:
  contents: write

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Rocket League stats
        id: fetch-rl
        run: npm run fetch:rl

      - name: Upload debug HTML on failure
        if: failure() && steps.fetch-rl.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rl-debug-html-${{ github.run_id }}
          path: debug_html.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code rocket_league_stats.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rocket_league_stats.json
          git commit -m "Update Rocket League stats [automated]"
          git push
