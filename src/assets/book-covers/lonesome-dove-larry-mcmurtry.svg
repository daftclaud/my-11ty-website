<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">Lonesome Dove cover placeholder</title>
  <desc id="desc">Decorative cover placeholder for Lonesome Dove by Larry McMurtry.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3b73" />
      <stop offset="100%" stop-color="#f6c177" />
    </linearGradient>
  </defs>
  <rect width="640" height="960" fill="url(#sky)" />
  <rect x="40" y="40" width="560" height="880" fill="none" stroke="#fef9ef" stroke-width="6" opacity="0.8" />
  <text x="320" y="370" text-anchor="middle" fill="#fef9ef" font-family="Georgia, serif" font-size="72" font-weight="700" letter-spacing="2">
    LONESOME
  </text>
  <text x="320" y="455" text-anchor="middle" fill="#fef9ef" font-family="Georgia, serif" font-size="72" font-weight="700" letter-spacing="2">
    DOVE
  </text>
  <text x="320" y="560" text-anchor="middle" fill="#fef9ef" font-family="Arial, sans-serif" font-size="32" letter-spacing="3">
    LARRY MCMURTRY
  </text>
</svg>
